name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # Remove if you want CI to pass first
    # needs: ci  # Uncomment to require CI to pass first

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t bus-ticket-backend:${{ github.sha }} ./backend

      - name: Save Docker image
        run: docker save bus-ticket-backend:${{ github.sha }} | gzip > bus-ticket-backend.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: bus-ticket-backend.tar.gz
          target: /tmp/bus-ticket-backend.tar.gz

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/bus-ticket-management/backend

            # Load the new image
            docker load < /tmp/bus-ticket-backend.tar.gz

            # Tag it
            docker tag bus-ticket-backend:${{ github.sha }} bus-ticket-backend:latest

            # Restart services
            docker compose up -d --force-recreate app

            # Cleanup
            rm /tmp/bus-ticket-backend.tar.gz
            docker rmi bus-ticket-backend:${{ github.sha }} || true

            echo "Deployment complete!"
